<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pré-Inscritos – Open CTB 2025</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
    :root {
        --azul: #19305A;
        --verde: #2BA02D;
        --verde-claro: #C3FE4D;
        --fundo: #F6F9FC;
        --branco: #ffffff;
    }

    body {
        margin: 0;
        padding: 0;
        background: var(--fundo);
        font-family: 'Montserrat', sans-serif;
        display: flex;
        justify-content: center;
    }

    .card {
        width: 95%;
        max-width: 650px;
        background: white;
        border-radius: 20px;
        margin-top: 30px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        padding: 25px;
        text-align: center;
    }

    header {
        width: 100%;
        margin-bottom: 25px;
    }

    header img {
        width: 100%;
        border-radius: 18px;
    }

    h2 {
        font-size: 24px;
        font-weight: 800;
        color: var(--azul);
        margin-bottom: 5px;
    }

    .loading {
        font-size: 18px;
        color: var(--verde);
        font-weight: 700;
        margin-bottom: 15px;
    }

    .erro {
        color: red;
        font-weight: 700;
        margin-top: 15px;
    }

    input, select {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #ccc;
        margin-bottom: 12px;
        font-size: 14px;
    }

    .tabs {
        display: flex;
        gap: 5px;
        justify-content: space-between;
        margin-bottom: 15px;
    }

    .tabs button {
        flex: 1;
        background: var(--azul);
        color: white;
        border: none;
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }

    th, td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        font-size: 14px;
    }

    th {
        background: var(--azul);
        color: white;
        font-weight: 700;
    }

    .voltar {
        margin-top: 25px;
        background: var(--verde);
        color: white;
        padding: 12px 20px;
        border-radius: 10px;
        display: inline-block;
        text-decoration: none;
        font-weight: 700;
    }
</style>
</head>

<body>

<div class="card">

    <header>
        <img src="opensite.png" alt="Open CTB 2025">
    </header>

    <h2>Pré-Inscritos — Open CTB 2025</h2>
    <div class="loading" id="loading">Carregando participantes...</div>
    <div class="erro" id="erro" style="display:none;">Erro ao carregar dados. Verifique a API.</div>

    <input type="text" id="filtroNome" placeholder="Filtrar por Nome">
    <input type="text" id="filtroClube" placeholder="Filtrar por Clube">

    <select id="filtroCategoria">
        <option value="">Todas Categorias</option>
        <option>Feminino</option>
        <option>Sub-11</option>
        <option>Sub-13</option>
        <option>Sub-15</option>
        <option>Sub-19</option>
        <option>Adulto A</option>
        <option>Adulto B</option>
        <option>Adulto C</option>
        <option>Veterano 40+</option>
        <option>Veterano 60+</option>
    </select>

    <div class="tabs">
        <button onclick="ordenar('Nome completo')">NOME</button>
        <button onclick="ordenar('Clube')">CLUBE</button>
        <button onclick="ordenar('Categorias')">CATEGORIAS</button>
        <button onclick="ordenar('Camisa')">CAMISA</button>
    </div>

    <table id="tabela">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Clube</th>
                <th>Camisa</th>
                <th>Categorias</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <a href="index.html" class="voltar">← Voltar</a>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzKZg6AhrCmHYMtIMWF3uQGlO7jEhghywWa4MNa6DSSQs3jFf7FcvpDuGvNMm0JBD9/exec";

let inscritos = [];
let filtrados = [];

async function carregarInscritos() {
    try {
        const resp = await fetch(API_URL);
        const dados = await resp.json();

        if (!dados.lista) throw new Error();

        inscritos = dados.lista;
        filtrados = inscritos;

        document.getElementById("loading").style.display = "none";

        renderTabela();

    } catch (err) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("erro").style.display = "block";
        console.error("Erro:", err);
    }
}

function renderTabela() {
    const tbody = document.querySelector("#tabela tbody");
    tbody.innerHTML = "";

    filtrados.forEach(item => {
        tbody.innerHTML += `
            <tr>
                <td>${item["Nome completo"] || ""}</td>
                <td>${item["Clube"] || ""}</td>
                <td>${item["Camisa"] || ""}</td>
                <td>${item["Categorias"] || ""}</td>
            </tr>`;
    });
}

document.getElementById("filtroNome").addEventListener("input", filtrar);
document.getElementById("filtroClube").addEventListener("input", filtrar);
document.getElementById("filtroCategoria").addEventListener("change", filtrar);

function filtrar() {
    const nome = document.getElementById("filtroNome").value.toLowerCase();
    const clube = document.getElementById("filtroClube").value.toLowerCase();
    const cat = document.getElementById("filtroCategoria").value;

    filtrados = inscritos.filter(item =>
        item["Nome completo"].toLowerCase().includes(nome) &&
        item["Clube"].toLowerCase().includes(clube) &&
        (cat === "" || item["Categorias"].includes(cat))
    );

    renderTabela();
}

function ordenar(campo) {
    filtrados.sort((a,b) => (a[campo] > b[campo] ? 1 : -1));
    renderTabela();
}

carregarInscritos();
</script>

</body>
</html>
