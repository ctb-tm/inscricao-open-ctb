<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pré-Inscritos – Open CTB 2025</title>

    <style>
        body {
            font-family: "Montserrat", sans-serif;
            background: #f6f9fc;
            color: #19305A;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header img {
            width: 90%;
            max-width: 420px;
            margin-top: 20px;
        }

        .box {
            background: #fff;
            width: 92%;
            max-width: 650px;
            margin: 25px auto;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.15);
        }

        h2 {
            margin-top: 5px;
            font-size: 26px;
            font-weight: 800;
        }

        .loading {
            color: green;
            font-weight: 700;
        }

        .erro {
            color: red;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .tabela {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            font-size: 14px;
        }

        .tabela th,
        .tabela td {
            border-bottom: 1px solid #ddd;
            padding: 10px;
        }

        .tabela th {
            background: #19305A;
            color: #fff;
            font-weight: 700;
        }

        button.voltar {
            background: #2BA02D;
            border: none;
            padding: 12px 25px;
            margin: 25px 0;
            border-radius: 12px;
            font-size: 16px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <img src="opensite.png" alt="Open CTB 2025">
    </header>

    <div class="box">
        <h2>Pré-Inscritos — Open CTB 2025</h2>

        <p id="status" class="loading">Carregando participantes...</p>

        <input type="text" id="filtroNome" placeholder="Filtrar por Nome">
        <input type="text" id="filtroClube" placeholder="Filtrar por Clube">

        <select id="filtroCategoria">
            <option value="">Todas Categorias</option>
            <option value="Feminino">Feminino</option>
            <option value="Sub-11">Sub-11</option>
            <option value="Sub-13">Sub-13</option>
            <option value="Sub-15">Sub-15</option>
            <option value="Sub-19">Sub-19</option>
            <option value="Adulto A">Adulto A</option>
            <option value="Adulto B">Adulto B</option>
            <option value="Adulto C">Adulto C</option>
            <option value="Veterano 40+">Veterano 40+</option>
            <option value="Veterano 60+">Veterano 60+</option>
        </select>

        <table class="tabela" id="tabela">
            <thead>
                <tr>
                    <th>Nº</th>
                    <th>Nome</th>
                    <th>Clube</th>
                    <th>Camisa</th>
                    <th>Categorias</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
            </tbody>
        </table>

        <button class="voltar" onclick="window.location.href='index.html'">⬅ Voltar</button>
    </div>

    <script>
        const API_URL =
            "https://script.google.com/macros/s/AKfycbzKZg6AhrCmHYMtIMWF3UqUGIo7jEhgyhvWa4MNa6DSSQs3jFf7FcvpDuGvNMm0JBD9/exec";

        let listaCompleta = [];

        async function carregarInscritos() {
            try {
                const resp = await fetch(API_URL);
                const dados = await resp.json();

                if (dados.status !== "ok") {
                    document.getElementById("status").innerHTML =
                        "<span class='erro'>Erro ao carregar dados. Verifique a API.</span>";
                    return;
                }

                listaCompleta = dados.lista;
                montarTabela(listaCompleta);
                document.getElementById("status").style.display = "none";

            } catch (erro) {
                console.error("ERRO API:", erro);
                document.getElementById("status").innerHTML =
                    "<span class='erro'>Erro ao carregar dados. API indisponível.</span>";
            }
        }

        function montarTabela(lista) {
            const corpo = document.getElementById("corpoTabela");
            corpo.innerHTML = "";

            lista.forEach(item => {
                const linha = `
                    <tr>
                        <td>${item["Nº"]}</td>
                        <td>${item["Nome completo"]}</td>
                        <td>${item["Clube"]}</td>
                        <td>${item["Camisa"]}</td>
                        <td>${item["Categorias"]}</td>
                    </tr>
                `;
                corpo.innerHTML += linha;
            });
        }

        function aplicarFiltros() {
            const nome = document.getElementById("filtroNome").value.toLowerCase();
            const clube = document.getElementById("filtroClube").value.toLowerCase();
            const categoria = document.getElementById("filtroCategoria").value;

            const filtrado = listaCompleta.filter(item =>
                item["Nome completo"].toLowerCase().includes(nome) &&
                item["Clube"].toLowerCase().includes(clube) &&
                (categoria === "" || item["Categorias"].includes(categoria))
            );

            montarTabela(filtrado);
        }

        document.getElementById("filtroNome").addEventListener("input", aplicarFiltros);
        document.getElementById("filtroClube").addEventListener("input", aplicarFiltros);
        document.getElementById("filtroCategoria").addEventListener("change", aplicarFiltros);

        carregarInscritos();
    </script>

</body>

</html>
