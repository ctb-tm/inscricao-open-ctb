<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pré-Inscritos — Open CTB 2025</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --azul:#19305A;
      --verde:#2BA02D;
      --verde-claro:#C3FE4D;
      --fundo:#F6F9FC;
      --branco:#ffffff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Montserrat",sans-serif;
      background:var(--fundo);
      color:var(--azul);
      display:flex;
      justify-content:center;
      padding:18px 12px 60px;
    }
    .wrap{width:100%;max-width:820px}
    header{
      background:var(--branco);
      border-radius:16px;
      padding:18px;
      box-shadow:0 8px 22px rgba(25,48,90,.08);
      display:flex;
      justify-content:center;
      align-items:center;
      margin-bottom:18px;
    }
    header img{max-width:100%;height:120px;object-fit:contain;border-radius:10px}

    .card{
      background:var(--branco);
      border-radius:16px;
      padding:20px;
      box-shadow:0 6px 20px rgba(25,48,90,.06);
    }
    h1{font-size:22px;margin:6px 0 8px;text-align:center;font-weight:800}
    .status{font-weight:700;color:var(--verde);text-align:center;margin-bottom:10px}
    .error{color:#c62828;font-weight:800;text-align:center;margin-bottom:10px}

    .controls{display:grid;grid-template-columns:1fr;gap:10px;margin:12px 0}
    input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #dcdcdc;font-size:14px}
    .table-wrap{overflow:auto;margin-top:14px;border-radius:12px}
    table{width:100%;border-collapse:collapse;min-width:720px}
    thead th{background:var(--azul);color:white;padding:10px;text-align:left;font-weight:700}
    td{padding:10px;border-bottom:1px solid #efefef;font-size:14px}
    tr:hover{background:rgba(25,48,90,0.03)}

    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:14px}
    .btn{background:linear-gradient(135deg,var(--verde),var(--verde-claro));color:var(--azul);padding:10px 14px;border-radius:10px;border:none;font-weight:800;cursor:pointer}
    .btn.secondary{background:#19305A;color:#fff}

    .footer{margin-top:18px;text-align:center;color:var(--azul);font-size:13px}
    @media(max-width:720px){
      header img{height:90px}
      table{min-width:560px}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <img src="opensite.png" alt="Open CTB 2025">
    </header>

    <div class="card">
      <h1>Inscritos — Open CTB 2025</h1>
      <div id="status" class="status">Carregando participantes…</div>
      <div id="error" class="error" style="display:none">Erro ao carregar dados. API indisponível.</div>

      <div class="controls">
        <input id="filterName" type="text" placeholder="Filtrar por Nome">
        <input id="filterClub" type="text" placeholder="Filtrar por Clube">
        <select id="filterCategory">
          <option value="">Todas Categorias</option>
          <option>Feminino</option>
          <option>Sub-11</option>
          <option>Sub-13</option>
          <option>Sub-15</option>
          <option>Sub-19</option>
          <option>Adulto A</option>
          <option>Adulto B</option>
          <option>Adulto C</option>
          <option>Veterano 40+</option>
          <option>Veterano 60+</option>
        </select>
      </div>

      <div class="toolbar">
        <button id="btnRefresh" class="btn">Atualizar</button>
        <button id="btnExport" class="btn secondary">Exportar CSV</button>
        <button id="btnBack" class="btn secondary" onclick="location.href='index.html'">Voltar</button>
      </div>

      <div class="table-wrap">
        <table id="table">
          <thead>
            <tr>
              <th>Nº</th>
              <th>Nome</th>
              <th>Clube</th>
              <th>Camisa</th>
              <th>Nome Sobrenome</th>
              <th>Categorias</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="footer">
        <div id="count"></div>
      </div>
    </div>
  </div>

<script>
  // URL do Apps Script (inserida conforme pedido)
  const API_URL = "https://script.google.com/macros/s/AKfycbyHROpmp1QS1rGjb7Mq5IlOnAl7GVCAdaht162WhxSA_nKXlNvPB5Y-TUzaNngMc6Fs/exec";

  let dataList = [];

  async function fetchData(){
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    statusEl.style.display = 'block';
    statusEl.textContent = 'Carregando participantes…';
    errorEl.style.display = 'none';
    try {
      const res = await fetch(API_URL, { cache: "no-store" });
      // se a resposta não for ok, tenta ler json de erro
      if (!res.ok) {
        const text = await res.text().catch(()=>null);
        throw new Error('Resposta do servidor: ' + res.status + (text? ' — '+text : ''));
      }
      const json = await res.json();
      if (json.status !== 'ok' || !Array.isArray(json.lista)){
        throw new Error('Formato de resposta inválido');
      }
      dataList = json.lista;
      renderTable(dataList);
      statusEl.style.display = 'none';
      updateCount();
    } catch(err){
      console.error('Fetch Error:', err);
      statusEl.style.display = 'none';
      errorEl.style.display = 'block';
      errorEl.textContent = 'Erro ao carregar dados. API indisponível.';
      updateCount(0);
    }
  }

  function renderTable(list){
    const tbody = document.querySelector('#table tbody');
    tbody.innerHTML = '';
    list.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${escapeHtml(r['Nº'] || '')}</td>
        <td>${escapeHtml(r['Nome completo'] || '')}</td>
        <td>${escapeHtml(r['Clube'] || '')}</td>
        <td>${escapeHtml(r['Camisa'] || '')}</td>
        <td>${escapeHtml(r['Nome Sobrenome'] || '')}</td>
        <td>${escapeHtml(r['Categorias'] || '')}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function applyFilters(){
    const name = document.getElementById('filterName').value.trim().toLowerCase();
    const club = document.getElementById('filterClub').value.trim().toLowerCase();
    const cat  = document.getElementById('filterCategory').value.trim().toLowerCase();

    const filtered = dataList.filter(r => {
      const rn = (r['Nome completo']||'').toString().toLowerCase();
      const rc = (r['Clube']||'').toString().toLowerCase();
      const rcats = (r['Categorias']||'').toString().toLowerCase();
      return rn.includes(name) && rc.includes(club) && (cat === '' || rcats.includes(cat));
    });
    renderTable(filtered);
    updateCount(filtered.length);
  }

  function updateCount(n){
    const c = document.getElementById('count');
    if (typeof n === 'number') {
      c.textContent = `Total: ${n}`;
    } else {
      c.textContent = `Total: ${dataList.length}`;
    }
  }

  // simple CSV export
  function exportCSV(){
    if (!dataList || !dataList.length) return alert('Nenhum dado para exportar.');
    const headers = ['Nº','Nome completo','Clube','Camisa','Nome Sobrenome','Categorias'];
    const rows = dataList.map(r => headers.map(h => `"${(r[h]||'').toString().replace(/"/g,'""')}"`).join(','));
    const csv = [headers.map(h=>`"${h}"`).join(',')].concat(rows).join('\r\n');
    const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'pre-inscritos-open-ctb.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // small helper: escape HTML to avoid injection
  function escapeHtml(str){
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');
  }

  // events
  document.getElementById('btnRefresh').addEventListener('click', fetchData);
  document.getElementById('btnExport').addEventListener('click', exportCSV);
  document.getElementById('filterName').addEventListener('input', applyFilters);
  document.getElementById('filterClub').addEventListener('input', applyFilters);
  document.getElementById('filterCategory').addEventListener('change', applyFilters);

  // initial load
  fetchData();
</script>
</body>
</html>
