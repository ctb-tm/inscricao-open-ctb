<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pré-Inscritos - Open CTB 2025</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --verde-claro: #C3FE4D;
      --verde: #2BA02D;
      --azul: #19305A;
      --fundo: #f6f9fc;
      --branco: #ffffff;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background: var(--fundo);
      color: var(--azul);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 756px;
      height: 200px;
      margin-top: 50px;
      border-radius: 25px;
      background: linear-gradient(135deg, #19305A 0%, #2BA02D 90%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(25, 48, 90, 0.25);
      overflow: hidden;
    }

    header img {
      max-height: 100%;
      max-width: 90%;
    }

    .container {
      width: 95%;
      max-width: 900px;
      margin: 40px auto 60px;
      background: var(--branco);
      border-radius: 18px;
      padding: 30px 40px;
      box-shadow: 0 4px 25px rgba(25, 48, 90, 0.1);
    }

    h2 {
      text-align: center;
      font-weight: 800;
      color: var(--azul);
      margin-bottom: 12px;
    }

    .contador {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      color: var(--verde);
      margin-bottom: 25px;
    }

    .filtros {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 25px;
    }

    .filtros input, .filtros select {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #bbb;
      font-size: 15px;
      min-width: 200px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(25,48,90,0.05);
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(25,48,90,0.05);
      text-align: left;
    }

    th {
      background: var(--azul);
      color: var(--branco);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 13px;
    }

    tr:hover {
      background: rgba(43,160,45,0.05);
    }

    .btn-voltar {
      display: inline-block;
      background: linear-gradient(135deg, var(--verde) 0%, var(--verde-claro) 100%);
      color: var(--azul);
      font-weight: 700;
      text-decoration: none;
      border-radius: 10px;
      padding: 12px 26px;
      margin-top: 30px;
      transition: all 0.3s ease;
    }

    .btn-voltar:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(43,160,45,0.3);
    }

    @media (max-width: 820px) {
      header { width: 90%; height: auto; }
      .container { width: 90%; padding: 20px; }
      table { font-size: 13px; }
      .filtros { flex-direction: column; }
    }
  </style>
</head>

<body>
  <header>
    <img src="opensite.png" alt="Open CTB 2025">
  </header>

  <div class="container">
    <h2>Pré-Inscritos — Open CTB 2025</h2>
    <div class="contador" id="contador">Carregando participantes...</div>

    <!-- FILTROS -->
    <div class="filtros">
      <input type="text" id="filtroNome" placeholder="Filtrar por Nome">
      <input type="text" id="filtroClube" placeholder="Filtrar por Clube">

      <select id="filtroCategoria">
        <option value="">Todas as Categorias</option>
        <option value="Feminino">Feminino</option>
        <option value="Sub-11">Sub-11</option>
        <option value="Sub-13">Sub-13</option>
        <option value="Sub-15">Sub-15</option>
        <option value="Sub-19">Sub-19</option>
        <option value="Adulto A">Adulto A</option>
        <option value="Adulto B">Adulto B</option>
        <option value="Adulto C">Adulto C</option>
        <option value="Veterano 40+">Veterano 40+</option>
        <option value="Veterano 60+">Veterano 60+</option>
      </select>
    </div>

    <!-- TABELA DINÂMICA -->
    <table id="tabelaInscritos">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Clube</th>
          <th>Categorias</th>
          <th>Camisa</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <a href="index.html" class="btn-voltar">⬅️ Voltar à Inscrição</a>
  </div>

  <script>
    const PLANILHA_URL =
      "https://opensheet.elk.sh/1m_ai30cbLA79RgKrjx55sqPWOSLNRPDUbwQUnqCPBzM/Respostas";

    let inscritos = [];

    async function carregarInscritos() {
      const res = await fetch(PLANILHA_URL);
      const data = await res.json();

      // Agora usando os nomes reais das colunas da sua planilha
      inscritos = data.map(linha => ({
        nome: linha["Nome completo"],
        clube: linha["Clube"],
        camisa: linha["Camisa"],
        nomeCamisa: linha["Nome Sobrenome"],
        categorias: linha["Categorias"]
      }));

      atualizarTabela();
    }

    function atualizarTabela() {
      const filtroNome = document.getElementById("filtroNome").value.toLowerCase();
      const filtroClube = document.getElementById("filtroClube").value.toLowerCase();
      const filtroCategoria = document.getElementById("filtroCategoria").value;

      const tbody = document.querySelector("#tabelaInscritos tbody");
      tbody.innerHTML = "";

      const filtrados = inscritos.filter(item => {
        const nomeMatch = item.nome?.toLowerCase().includes(filtroNome);
        const clubeMatch = item.clube?.toLowerCase().includes(filtroClube);
        const categoriaMatch =
          filtroCategoria === "" ||
          (item.categorias && item.categorias.includes(filtroCategoria));
        return nomeMatch && clubeMatch && categoriaMatch;
      });

      filtrados.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.nome}</td>
          <td>${row.clube || "-"}</td>
          <td>${row.categorias || "-"}</td>
          <td>${row.camisa || "-"}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("contador").innerText =
        `Total de Pré-Inscritos: ${filtrados.length}`;
    }

    document.getElementById("filtroNome").addEventListener("input", atualizarTabela);
    document.getElementById("filtroClube").addEventListener("input", atualizarTabela);
    document.getElementById("filtroCategoria").addEventListener("change", atualizarTabela);

    carregarInscritos();
  </script>
</body>
</html>
