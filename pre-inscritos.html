<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pré-Inscritos - Open CTB 2025</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --verde: #2BA02D;
  --verde-claro: #C3FE4D;
  --azul: #19305A;
  --fundo: #f6f9fc;
  --branco: #fff;
}

body {
  font-family: "Montserrat", sans-serif;
  background: var(--fundo);
  color: var(--azul);
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
}

header {
  width: 756px;
  height: 200px;
  margin-top: 40px;
  border-radius: 20px;
  background: linear-gradient(135deg, #19305A 0%, #2BA02D 90%);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 25px rgba(25, 48, 90, 0.25);
  overflow: hidden;
}

header img {
  max-height: 100%;
  max-width: 90%;
}

.container {
  width: 95%;
  max-width: 900px;
  margin: 28px auto 60px;
  background: var(--branco);
  border-radius: 16px;
  padding: 24px 28px;
  box-shadow: 0 4px 20px rgba(25,48,90,.08);
}

h2 {
  text-align: center;
  font-weight: 800;
  color: var(--azul);
  margin: 6px 0 12px;
}

.contador {
  text-align: center;
  font-size: 16px;
  font-weight: 700;
  color: var(--verde);
  margin-bottom: 16px;
}

table {
  width: 100%;
  border-collapse: collapse;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 0 0 1px rgba(25,48,90,.05);
}

th, td {
  padding: 10px 12px;
  border-bottom: 1px solid rgba(25,48,90,.05);
  text-align: left;
}

th {
  background: var(--azul);
  color: var(--branco);
  font-weight: 700;
  text-transform: uppercase;
  font-size: 12px;
}

tr:hover {
  background: rgba(43,160,45,.04);
}

.erro {
  color: #b00020;
  text-align: center;
  margin-top: 12px;
  font-weight: 700;
}

.btn-voltar {
  display: block;
  width: max-content;
  margin: 20px auto 0;
  background: linear-gradient(135deg, var(--verde), var(--verde-claro));
  color: var(--azul);
  padding: 12px 24px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: 700;
}

@media(max-width: 820px) {
  header { width: 90%; height: auto; }
  .container { width: 90%; padding: 18px; }
}
</style>
</head>

<body>

<header>
  <img src="opensite.png" alt="Open CTB 2025">
</header>

<div class="container">
  <h2>Pré-Inscritos — Open CTB 2025</h2>

  <div class="contador" id="contador">Carregando participantes…</div>
  <div id="erro" class="erro" style="display:none"></div>

  <table id="tabela">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Clube</th>
        <th>Categorias</th>
        <th>Camisa</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <a class="btn-voltar" href="index.html">⬅ Voltar</a>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzKZg6AhrCmHYMtIMWF3UqUGIo7jEhgyhvWa4MNa6DSSQs3jFf7FcvpDuGvNMm0JBD9/exec";

async function carregar() {
  const contador = document.getElementById("contador");
  const erro = document.getElementById("erro");
  const tbody = document.querySelector("#tabela tbody");

  try {
    contador.textContent = "Carregando participantes…";
    
    const r = await fetch(API_URL, { cache: "no-store" });
    const json = await r.json();

    if (json.status !== "ok") {
      throw new Error("Resposta inesperada da API");
    }

    const dados = json.data;
    tbody.innerHTML = "";

    dados.forEach(linha => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${linha["Nome completo"] || ""}</td>
        <td>${linha["Clube"] || ""}</td>
        <td>${linha["Categorias"] || ""}</td>
        <td>${linha["Camisa"] || ""}</td>
      `;
      tbody.appendChild(tr);
    });

    contador.textContent = `Total de Pré-Inscritos: ${dados.length}`;

  } catch (e) {
    erro.style.display = "block";
    erro.textContent = "Erro ao carregar dados. Verifique a API.";
    console.error(e);
  }
}

carregar();
</script>

</body>
</html>
